# Builds on GitHub's machines: no Mac needed.
# Free minutes: public repositories build for free; private ones use the
# monthly quota (macOS minutes count ten times).
name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the app is developed and verified on this exact SDK, and a
      # newer stable brings new analyzer lints that fail the build for no
      # functional reason. Bump both jobs together when the local SDK moves.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      # opencv_dart builds its native library through the NDK / CMake.
      - name: Install NDK and CMake
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Analyze and test
        working-directory: app
        # The log itself needs a login to read, but ::error:: lines show up as
        # public check-run annotations, so failures here stay diagnosable.
        run: |
          set +e
          flutter --version
          { flutter analyze && flutter test -r expanded; } > "$RUNNER_TEMP/step.log" 2>&1
          code=$?
          tail -n 120 "$RUNNER_TEMP/step.log"
          if [ $code -ne 0 ]; then
            grep -nE "error|Error|ERROR|failed|FAILED|Exception|Unhandled" "$RUNNER_TEMP/step.log" \
              | grep -v "0 error" | head -n 25 | cut -c1-600 | sed 's/^/::error::/'
            exit $code
          fi
      - name: Build APK
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build (no codesign)
        working-directory: app
        run: |
          set +e
          flutter --version
          flutter build ios --release --no-codesign > "$RUNNER_TEMP/step.log" 2>&1
          code=$?
          tail -n 150 "$RUNNER_TEMP/step.log"
          if [ $code -ne 0 ]; then
            grep -nE "error:|Error|error |failed|FAILED|Exception|Hash mismatch|curl|xcframework" "$RUNNER_TEMP/step.log" \
              | head -n 25 | cut -c1-600 | sed 's/^/::error::/'
            # The line number points at the failure; the reason is just above
            # it, and CocoaPods buries it in its own output.
            for n in $(grep -nE "Error running pod install|Error output from CocoaPods" "$RUNNER_TEMP/step.log" | cut -d: -f1); do
              sed -n "$((n>25 ? n-25 : 1)),$((n+5))p" "$RUNNER_TEMP/step.log" \
                | cut -c1-400 | sed 's/^/::error::pod| /'
            done
            exit $code
          fi
      - name: Package IPA
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app/build/ios/iphoneos/app-unsigned.ipa
